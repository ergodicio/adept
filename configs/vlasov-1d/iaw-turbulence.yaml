# reference: ion makes the normalization ion-referenced (t in 1/omega_pi,
# v in v_ti), so normalizing_temperature/density label the ion temperature
# and density and write_units() reports ion-referenced physical quantities.
units:
  normalizing_temperature: 1000eV
  normalizing_density: 1.0e19/cc
  reference: ion
  A: 1.0
  Z: 1.0
density:
  quasineutrality: true
  species-ion-background:
    noise_seed: 416
    noise_type: gaussian
    noise_val: 1.0e-06
    v0: 0.0
    T0: 1.0
    m: 2.0
    basis: uniform
    baseline: 1.0
grid:
  dt: 0.25
  nx: 2048
  tmin: 0.0
  tmax: 10000.0
  xmax: 458.0
  xmin: 0.0
save:
  fields:
    t:
      nt: 1001
  ion:
    main:
      t:
        tmin: 0.0
        tmax: 10000.0
        nt: 11
solver: vlasov-1d-iaw
mlflow:
  experiment: iaw-turbulence
  run: te-over-ti-0.05
drivers:
  ex: {}
  ey: {}
  ex_stochastic:
    modes:
    - 1
    amplitude: 0.0021834
    tau: 458.0
    seed: 42
diagnostics:
  diag-vlasov-dfdt: false
  diag-fp-dfdt: false
terms:
  field: poisson-boltzmann
  boltzmann_electrons:
    Te: 0.05
  edfdv: cubic-spline
  time: sixth
  species:
  - name: ion
    charge: 1.0
    mass: 1.0
    vmax: 6.4
    nv: 512
    density_components:
    - species-ion-background
  fokker_planck:
    is_on: false
    type: Dougherty
    time:
      baseline: 1.0
      bump_or_trough: bump
      center: 0.0
      rise: 25.0
      slope: 0.0
      bump_height: 0.0
      width: 100000.0
    space:
      baseline: 1.0
      bump_or_trough: bump
      center: 0.0
      rise: 25.0
      slope: 0.0
      bump_height: 0.0
      width: 100000.0
  krook:
    is_on: false
    time:
      baseline: 1.0
      bump_or_trough: bump
      center: 0.0
      rise: 25.0
      slope: 0.0
      bump_height: 0.0
      width: 100000.0
    space:
      baseline: 1.0
      bump_or_trough: bump
      center: 0.0
      rise: 25.0
      slope: 0.0
      bump_height: 0.0
      width: 100000.0
iaw_diagnostics:
  nk_modes: 1024
  nk_nt: 2001
  spectrum_window:
  - 0.5
  - 1.0
