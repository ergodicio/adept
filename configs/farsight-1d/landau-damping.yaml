solver: farsight-1d
grid:
  nx: 32
  nv: 64
  xmin: 0.0
  xmax: 12.566370614359172
  vmin: -6.0
  vmax: 6.0
time:
  tmin: 0.0
  tmax: 12.0
  dt: 0.05
initial:
  kind: maxwellian
  thermal_speed: 1.0
  drift: 0.0
  amplitude: 0.0001
  mode: 1
numerical:
  # Resolved smoothing: epsilon / dx = 2.29; this is a regularized model.
  epsilon: 0.9
  quadrature: trapezoid
  remesh_every: 1
  chunk_size: 64
save:
  scalars:
    every_steps: 2
  fields:
    every_steps: 2
  distribution:
    every_steps: 40
