# Backward SRS driven by a static pump on a linear density ramp.
# This is the JAX translation of the lpse-matlab `srs_1D` case (m201805_matlabLpse_v11.m)
# run as a quasi-1D 2D box: the pump propagates in +x, the Raman light E1 is evolved with a
# finite-difference paraxial solver and grows from the EPW noise (and the optional E1 seed
# below), and the reflectivity is recorded at a probe on the low-density side.
density:
  basis: linear
  gradient scale length: 50um
  max: 0.28
  min: 0.18
  noise:
    max: 1.0e-09
    min: 1.0e-10
    type: uniform
drivers:
  E0:
    params:
      phases:
        seed: 42
    shape: uniform
    delta_omega_max: 0.015
    num_colors: 1
    envelope:
      tw: 40ps
      tr: 0.1ps
      tc: 20.25ps
      xr: 0.2um
      xw: 1000um
      xc: 50um
      yr: 0.2um
      yw: 1000um
      yc: 50um
  # Optional Raman seed. Only usable when the density at the injector (x = xmax - offset)
  # is below the w1 critical density (n < 0.25 nc for envelope density 0.25) -- on this
  # 0.18-0.28 ramp the seed would be evanescent, so SRS grows from the EPW noise instead
  # (the MATLAB srs_1D case with I1 = 0).
  # E1:
  #   intensity: 1.0e+12W/cm^2
  #   delta_omega: 0.0
  #   turn_on_time: 10fs
grid:
  boundary_abs_coeff: 1.0e4
  boundary_width: 3um
  low_pass_filter: 0.6
  dt: 1fs
  dx: 50nm
  tmax: 10.0ps
  tmin: 0.0ns
  ymax: 3um
  ymin: -3um
mlflow:
  experiment: srs
  run: srs-test
save:
  fields:
    t:
      dt: 0.5ps
      tmax: 10ps
      tmin: 0ps
    x:
      dx: 80nm
    y:
      dy: 128nm
solver: envelope-2d
terms:
  epw:
    boundary:
      x: absorbing
      y: periodic
    damping:
      collisions: 0.1
      landau: true
    density_gradient: true
    linear: true
    source:
      noise: true
      tpd: false
      srs: true
  zero_mask: true
units:
  atomic number: 1
  envelope density: 0.25
  ionization state: 1
  laser intensity: 1.5e+15W/cm^2
  laser_wavelength: 351nm
  reference electron temperature: 2000.0eV
  reference ion temperature: 1000eV
