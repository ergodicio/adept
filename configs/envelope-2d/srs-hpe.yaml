# Backward SRS on a linear density ramp with Follett-style hybrid particle
# evolution (terms.hpe): tail test electrons evolve the Landau damping rate
# self-consistently (kinetic inflation + hot electrons). Quasi-1D (the y extent
# collapses to a single cell -- terms.hpe requires ny == 1). The particle push
# dominates the runtime; run this on a GPU.
density:
  basis: linear
  gradient scale length: 50um
  max: 0.28
  min: 0.18
  noise:
    max: 1.0e-09
    min: 1.0e-10
    type: uniform
drivers:
  E0:
    params:
      phases:
        seed: 42
    shape: uniform
    delta_omega_max: 0.015
    num_colors: 1
    envelope:
      tw: 40ps
      tr: 0.1ps
      tc: 20.25ps
      xr: 0.2um
      xw: 1000um
      xc: 50um
      yr: 0.2um
      yw: 1000um
      yc: 50um
grid:
  boundary_abs_coeff: 1.0e4
  boundary_width: 3um
  low_pass_filter: 0.6
  dt: 1fs
  dx: 50nm
  tmax: 10.0ps
  tmin: 0.0ns
  ymax: 0.025um
  ymin: -0.025um
mlflow:
  experiment: srs
  run: srs-hpe
save:
  fields:
    t:
      dt: 0.5ps
      tmax: 10ps
      tmin: 0ps
    x:
      dx: 80nm
    y:
      dy: 128nm
solver: envelope-2d
terms:
  epw:
    boundary:
      x: absorbing
      y: periodic
    damping:
      collisions: 0.1
      landau: true
    density_gradient: true
    linear: true
    source:
      noise: true
      tpd: false
      srs: true
  hpe:
    active: true
    n_particles: 500000
    v_min: 2.5
    substep_courant: 0.05
    tau_damping: 100fs
    t_start: 0ps
  # pump depletion is the physical saturation channel: with HPE quenching the
  # Landau damping, a prescribed (fixed-amplitude) pump would feed unbounded SRS
  light:
    pump_depletion: true
  zero_mask: true
units:
  atomic number: 1
  envelope density: 0.25
  ionization state: 1
  laser intensity: 1.5e+15W/cm^2
  laser_wavelength: 351nm
  reference electron temperature: 2000.0eV
  reference ion temperature: 1000eV
