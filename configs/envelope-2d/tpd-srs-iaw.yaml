# Full coupled 2D LPI: TPD + backward SRS, reciprocal pump depletion,
# ion-acoustic ponderomotive response, and one box-averaged 2D2V tail-particle
# ensemble feeding angle-resolved Landau damping back to every EPW mode.
density:
  basis: linear
  gradient scale length: 200um
  max: 0.28
  min: 0.18
  noise:
    max: 1.0e-09
    min: 1.0e-10
    type: uniform
drivers:
  E0:
    delta_omega_max: 0.015
    envelope:
      tc: 200.25ps
      tr: 0.1ps
      tw: 400ps
      xc: 50um
      xr: 0.2um
      xw: 1000um
      yc: 50um
      yr: 0.2um
      yw: 1000um
    num_colors: 1
    shape: uniform
    params:
      phases:
        seed: 42
grid:
  boundary_abs_coeff: 1.0e4
  boundary_width: 1.5um
  dealias: shifted-band
  low_pass_filter: 0.6
  dt: 1fs
  dx: 66.3nm
  tmax: 5ps
  tmin: 0ps
  ymax: 6um
  ymin: -6um
mlflow:
  experiment: tpd-srs-iaw
  run: tpd-srs-iaw
save:
  fields:
    t:
      dt: 0.2ps
      tmax: 5ps
      tmin: 0ps
    x:
      dx: 80nm
    y:
      dy: 80nm
solver: envelope-2d
terms:
  epw:
    boundary:
      x: absorbing
      y: periodic
    damping:
      collisions: 1.0
      landau: true
    density_gradient: true
    linear: true
    source:
      noise: true
      noise_seed: 42
      tpd: true
      srs: true
  iaw:
    active: true
    boundary: null
    damping:
      collisions: 1.0e-5
      landau: 0.1
    max_density_perturbation: 0.1
  hpe:
    active: true
    n_particles: 500000
    n_angles: 32
    v_min: 2.5
    substep_courant: 0.05
    tau_damping: 100fs
    t_start: 0ps
  light:
    pump_depletion: true
  zero_mask: true
units:
  atomic number: 40
  envelope density: 0.25
  ionization state: 6
  laser intensity: 3.5e+14W/cm^2
  laser_wavelength: 351nm
  reference electron temperature: 2000eV
  reference ion temperature: 1000eV
