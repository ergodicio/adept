# Short NERSC benchmark for the published Joglekar et al. geometry.
# The Letter uses a central uniform x mesh out to +/-136 um and a stretched
# mesh to +/-510 um. VFP-2D is still Fourier-periodic, so this first benchmark
# uses the full wide x extent at the published central dx: periodic images are
# 1.02 mm apart and act as effectively open boundaries on this timescale.
solver: vfp-2d

mlflow:
  experiment: vfp2d-joglekar-2014
  run: published-geometry-wide-x-60ps-sharded

units:
  laser_wavelength: 351nm
  reference electron temperature: 1600eV
  reference ion temperature: 160eV
  reference electron density: 2.5e22/cm^3
  # The Letter does not report the mean ionization in its five pages.
  Z: 1
  Ion: Au+
  logLambda: nrl

density:
  quasineutrality: true
  species-electron:
    m: 2.0
    n: {basis: uniform, baseline: 1.0}
    T: {basis: uniform, baseline: 1.0}

grid:
  # r0=17 um and lambda_mfp=0.34 um in Joglekar et al. PRL 112, 105004.
  # dx=13.4 lambda_mfp and dy=3.125 lambda_mfp match the published central mesh.
  xmin: -510um
  xmax: 510um
  nx: 224
  ymin: -34um
  ymax: 34um
  ny: 64
  tmin: 0ps
  tmax: 60ps
  # The linear RK4 bound permits a larger step, but the coupled kinetic-Ohm
  # system needs this margin for velocity-space acceleration and positivity.
  # max(k v dt)=0.526, versus the RK4 imaginary-axis limit 2 sqrt(2).
  dt: 2fs
  nv: 96
  vmax: 8.0
  lmax: 2
  mmax: 2
  sharding: {enabled: true, axis: x}

terms:
  # Suppress the grid-scale pseudospectral cascade without touching velocity
  # space. This is the same high-order Hou-Li regularization used elsewhere in
  # ADEPT; resolved spot and transport scales are effectively unchanged.
  # Sharded spatial derivatives use fourth-order stencils; retain a local y Hou-Li filter.
  hou_li_filter: {is_on: true, alpha: 36.0, order: 36, dimensions: [y]}
  field_solver:
    mode: kinetic-ohm
    hidden_density_gradient:
      active: true
      scale_length: 17um
      switch_off: 17.78ps  # 800 tau_n in the Letter
      switch_width: 0.5ps
      # Joglekar et al. prescribe this same two-spot envelope for d(n)/dz.
      profile:
        basis: gaussian_spots
        x_center: 0um
        x_radius: 17um
        # The published source is centered at the two y boundaries.
        y_centers: [-34um, 34um]
        y_radius: 17um
  fokker_planck:
    active: true
    flm: {ee: true}
    # Chang-Cooper is positivity preserving and is the safer choice once IB
    # heating drives f00 far from Maxwellian. The 2 fs Strang step applies
    # collisions in 1 fs half-steps, about 0.045 tau_n for this benchmark.
    f00: {model: CoulombianKernel, scheme: chang_cooper, positivity: conservative}

drivers:
  ib:
    intensity_1e15_Wcm2: 0.25
    polarisation: linear
    # Heating remains on after the imposed hidden density gradient is removed.
    profile:
      basis: gaussian_spots
      x_center: 0um
      x_radius: 17um
      y_centers: [-34um, 34um]
      y_radius: 17um

save:
  t: {tmin: 0ps, tmax: 60ps, nt: 13}

output:
  n_panels: 9
