# NERSC production pilot for two-spot Nernst-driven reconnection.
#
# The spot centers are separated by three Gaussian radii. Their 1/e contours
# have a one-radius (17 um) gap, while the midpoint still receives 21% of one
# spot's peak heating. This creates a modest transport region in which v_N x B
# must carry the Biermann field into the current sheet.
solver: vfp-2d

mlflow:
  experiment: vfp2d-joglekar-2014
  run: two-spot-nernst-reconnection-200ps-chang-cooper

units:
  laser_wavelength: 351nm
  reference electron temperature: 1600eV
  reference ion temperature: 160eV
  reference electron density: 2.5e22/cm^3
  # The Letter does not report the mean ionization in its five pages.
  Z: 1
  Ion: Au+
  logLambda: nrl

density:
  quasineutrality: true
  species-electron:
    m: 2.0
    n: {basis: uniform, baseline: 1.0}
    T: {basis: uniform, baseline: 1.0}

grid:
  # r0=17 um and lambda_mfp=0.34 um in Joglekar et al. PRL 112, 105004.
  # The padding makes the periodic images negligible at the boundaries.
  xmin: -51um
  xmax: 51um
  nx: 64
  ymin: -85um
  ymax: 85um
  ny: 96
  tmin: 0ps
  tmax: 200ps
  # The linear RK4 bound permits a larger step, but the coupled kinetic-Ohm
  # system needs this margin for velocity-space acceleration and positivity.
  # max(k v dt)=0.526, versus the RK4 imaginary-axis limit 2 sqrt(2).
  dt: 2fs
  nv: 96
  vmax: 8.0
  lmax: 2
  mmax: 2

terms:
  field_solver:
    mode: kinetic-ohm
    hidden_density_gradient:
      active: true
      scale_length: 17um
      switch_off: 17.78ps  # 800 tau_n in the Letter
      switch_width: 0.5ps
      # Joglekar et al. prescribe this same two-spot envelope for d(n)/dz.
      profile:
        basis: gaussian_spots
        x_center: 0um
        x_radius: 17um
        y_centers: [-25.5um, 25.5um]
        y_radius: 17um
  fokker_planck:
    active: true
    flm: {ee: true}
    # Chang-Cooper is positivity preserving and is the safer choice once IB
    # heating drives f00 far from Maxwellian. The 2 fs Strang step applies
    # collisions in 1 fs half-steps, about 0.045 tau_n for this benchmark.
    f00: {model: CoulombianKernel, scheme: chang_cooper}

drivers:
  ib:
    intensity_1e15_Wcm2: 0.25
    polarisation: linear
    switch_off: 17.78ps
    switch_width: 0.5ps
    profile:
      basis: gaussian_spots
      x_center: 0um
      x_radius: 17um
      y_centers: [-25.5um, 25.5um]
      y_radius: 17um

save:
  t: {tmin: 0ps, tmax: 200ps, nt: 21}

output:
  n_panels: 9
