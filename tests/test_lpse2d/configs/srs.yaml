# Homogeneous-plasma backward-SRS growth test box.
# Uniform density equal to the envelope density (so there is no detuning), periodic in x,
# noise-seeded. The EPW energy should grow at ~2*gamma0 (see test_srs.py).
density:
  basis: uniform
  val: 0.2
  noise:
    max: 1.0e-09
    min: 1.0e-10
    type: uniform
drivers:
  E0:
    params:
      phases:
        seed: 42
    shape: uniform
    delta_omega_max: 0.015
    num_colors: 1
    envelope:
      tw: 40ps
      tr: 0.02ps
      tc: 20.05ps
      xr: 0.2um
      xw: 1000um
      xc: 50um
      yr: 0.2um
      yw: 1000um
      yc: 50um
grid:
  boundary_abs_coeff: 1.0e4
  boundary_width: 3um
  low_pass_filter: 0.6
  dt: 1fs
  dx: 50nm
  xmax: 80um
  tmax: 1.2ps
  tmin: 0.0ns
  ymax: 0.25um
  ymin: -0.25um
mlflow:
  experiment: test-lpse
  run: srs-test
save:
  fields:
    t:
      dt: 0.1ps
      tmax: 1.2ps
      tmin: 0ps
solver: envelope-2d
terms:
  epw:
    boundary:
      x: periodic
      y: periodic
    damping:
      collisions: false
      landau: true
    density_gradient: true
    linear: true
    source:
      noise: true
      tpd: false
      srs: true
  zero_mask: true
units:
  atomic number: 1
  envelope density: 0.2
  ionization state: 1
  laser intensity: 1.5e+15W/cm^2
  laser_wavelength: 351nm
  reference electron temperature: 2000.0eV
  reference ion temperature: 1000eV
