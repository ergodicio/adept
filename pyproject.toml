[project]
name = "adept"
version = "0.1.0"
description = "Automatic-Differentiation-Enabled Plasma Transport in JAX"
readme = "README.md"
authors = [
    {name = "Archis Joglekar/Ergodic LLC", email="archis@ergodic.io"},
]
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11"
dependencies = [
    # >=0.1.0 required for the batched tridiagonal solve. Earlier lineax dispatches
    # `lx.Tridiagonal` to a hand-rolled Thomas `jax.lax.scan`, which is serial over the
    # velocity axis; lineax#152 routes it to `jax.lax.linalg.tridiagonal_solve` instead.
    # This transitively floors jax>=0.6.1 (see the `jax` pin below).
    "lineax>=0.1.0",
    "diffrax",
    "matplotlib",
    "scipy",
    "numpy",
    "tqdm",
    "xarray",
    "mlflow",
    "h5netcdf",
    "optax",
    "pint",
    "plasmapy",
    "psutil",
    "interpax @ git+https://github.com/f0uriest/interpax.git",
    "tabulate",
    "pydantic",
    "scienceplots",
    # >=0.6.1 carries jax#28696, which lowers batched tridiagonal solves to the batched
    # cuSPARSE gtsv2 routine. Before it, the CUDA path looped over the batch host-side,
    # so a vmapped solve scaled linearly in the batch dimension.
    "jax>=0.6.1",
]

[project.urls]
Homepage = "https://github.com/ergodicio/adept"
Documentation = "https://ergodicio.github.io/adept/"

[project.optional-dependencies]
cpu = []
gpu = [
    "jax[cuda12]",
    "nvidia-ml-py"
]
docs = [
    "sphinx>=7.0",
    "sphinx_copybutton",
    "sphinx-rtd-theme>=2.0",
    "sphinx-github-style>=1.1",
    # lets sphinx read the markdown pages under docs/source; see conf.py extensions
    "myst-parser>=4.0",
    "adept"
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-regressions",
    "typeguard",
    "adept[docs]",
]

[build-system]
requires = ["hatchling", "hatch-vcs", "toml"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "adept/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
# Test type hints w/ typeguard - currently disabled
# addopts = ["--typeguard-packages=adept"]
addopts = "--import-mode=importlib --strict-markers -m 'not slow'"
markers = ["slow: long-running parameter sweeps"]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ignored by default
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    # raised by Cython, usually harmless
    "ignore:numpy.dtype size changed",
    "ignore:numpy.ufunc size changed",
    # sometimes, dependencies leak resources
    "ignore:.*socket\\.socket.*:pytest.PytestUnraisableExceptionWarning",
]
